<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180"><rect width="100%" height="100%" fill="white"/><text x="14" y="24" font-family="Arial,sans-serif" font-size="17" fill="#17324D" font-weight="bold">A knockout measures what a message did, not whether it should have done it.</text><rect x="12" y="40" width="167" height="100" rx="3" fill="white" stroke="#8a5a00" stroke-width="1.5"/><text x="21" y="64" font-family="Arial,sans-serif" font-size="16" fill="#8a5a00" font-weight="bold">L0 Suspicious text</text><text x="21" y="91" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">Transcript</text><text x="21" y="116" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">I0</text><rect x="189" y="40" width="167" height="100" rx="3" fill="white" stroke="#0b5cad" stroke-width="1.5"/><text x="198" y="64" font-family="Arial,sans-serif" font-size="16" fill="#0b5cad" font-weight="bold">L1 Causal influence</text><text x="198" y="91" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">Knockout changes</text><text x="198" y="116" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">behaviour: I1</text><rect x="366" y="40" width="167" height="100" rx="3" fill="white" stroke="#b3261e" stroke-width="1.5"/><text x="375" y="64" font-family="Arial,sans-serif" font-size="16" fill="#b3261e" font-weight="bold">L2 Harmful exposure</text><text x="375" y="91" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">Valid replay +</text><text x="375" y="116" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">harm/control gates</text><rect x="543" y="40" width="167" height="100" rx="3" fill="white" stroke="#6b3fa0" stroke-width="1.5"/><text x="552" y="64" font-family="Arial,sans-serif" font-size="16" fill="#6b3fa0" font-weight="bold">L3 Attribution</text><text x="552" y="91" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">Separating probe</text><text x="552" y="116" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">or norm: I4 / I5</text><text x="14" y="163" font-family="Arial,sans-serif" font-size="16" fill="#17324D" font-weight="normal">Each rung requires its own evidence; no rung implies the next. Conceptual diagram.</text></svg>
