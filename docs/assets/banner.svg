<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">CCC: Counterfactual Collusion Certificates</title>
  <desc id="d">Project banner. Left: logo, title and tagline. Right: two constructed teams, one permitted and one prohibited, show the same outsider reward at evidence levels I0 to I3 (14, 19, 14, 19). At I4 a cost probe separates them: 29 for the permitted team and 14 for the prohibited team.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#10263c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#1f5f8b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f5f8b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a4a6b" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="440" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="438.5" rx="26" fill="none" stroke="#24486b" stroke-width="1.5"/>

  <!-- Logo: a hexagon holding a two-agent coalition and one outsider -->
  <g transform="translate(64 58)">
    <path d="M44 0 L88 25 L88 75 L44 100 L0 75 L0 25 Z" fill="#0f2a44" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="38" x2="56" y2="38" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="26" cy="38" r="10" fill="#38bdf8"/>
    <circle cx="60" cy="38" r="10" fill="#38bdf8"/>
    <line x1="43" y1="46" x2="43" y2="62" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
    <circle cx="43" cy="72" r="9" fill="none" stroke="#fbbf24" stroke-width="4"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="172" y="104" fill="#f1f5f9" font-size="64" font-weight="800" letter-spacing="10">CCC</text>
    <text x="174" y="136" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="1.8">COUNTERFACTUAL COLLUSION CERTIFICATES</text>

    <text x="64" y="214" fill="#e2e8f0" font-size="27" font-weight="600">When cooperation looks like collusion.</text>
    <text x="64" y="252" fill="#cbd5e1" font-size="21">Auditing multi-agent AI with controlled replay,</text>
    <text x="64" y="282" fill="#cbd5e1" font-size="21">twin worlds and exact tests.</text>
  </g>

  <!-- Chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.2" fill="#bae6fd">
    <rect x="64" y="322" width="232" height="34" rx="17" fill="#0f2a44" stroke="#2f6a96"/>
    <text x="180" y="344" text-anchor="middle">COUNTERFACTUAL REPLAY</text>
    <rect x="306" y="322" width="140" height="34" rx="17" fill="#0f2a44" stroke="#2f6a96"/>
    <text x="376" y="344" text-anchor="middle">TWIN WORLDS</text>
    <rect x="456" y="322" width="140" height="34" rx="17" fill="#0f2a44" stroke="#2f6a96"/>
    <text x="526" y="344" text-anchor="middle">EXACT TESTS</text>
    <rect x="64" y="366" width="170" height="34" rx="17" fill="#0f2a44" stroke="#2f6a96"/>
    <text x="149" y="388" text-anchor="middle">PREREGISTERED</text>
    <rect x="244" y="366" width="214" height="34" rx="17" fill="#0f2a44" stroke="#2f6a96"/>
    <text x="351" y="388" text-anchor="middle">HASH-PINNED RECORDS</text>
  </g>

  <!-- Evidence panel -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="652" y="44" width="580" height="352" rx="20" fill="#0c1d31" fill-opacity="0.85" stroke="#24486b" stroke-width="1.5"/>
    <text x="680" y="82" fill="#94a3b8" font-size="15" font-weight="700" letter-spacing="2">OUTSIDER REWARD BY EVIDENCE LEVEL</text>

    <!-- bracket over I0-I3 -->
    <path d="M818 118 V108 H1102 V118" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="960" y="100" fill="#7dd3fc" font-size="15" font-weight="600" text-anchor="middle">identical evidence</text>
    <path d="M1124 118 V108 H1198 V118" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="1161" y="100" fill="#fcd34d" font-size="15" font-weight="600" text-anchor="middle">cost probe</text>

    <!-- column headings -->
    <g fill="#cbd5e1" font-size="17" font-weight="700" text-anchor="middle">
      <text x="848" y="146">I0</text><text x="924" y="146">I1</text><text x="1000" y="146">I2</text><text x="1076" y="146">I3</text><text x="1161" y="146">I4</text>
    </g>

    <!-- row A -->
    <text x="680" y="190" fill="#f1f5f9" font-size="19" font-weight="700">Team A</text>
    <text x="680" y="212" fill="#86efac" font-size="14" font-weight="600">permitted</text>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <rect x="818" y="164" width="60" height="54" rx="10" fill="#12385a" stroke="#38bdf8" stroke-width="1.5"/><text x="848" y="198" fill="#e0f2fe">14</text>
      <rect x="894" y="164" width="60" height="54" rx="10" fill="#12385a" stroke="#38bdf8" stroke-width="1.5"/><text x="924" y="198" fill="#e0f2fe">19</text>
      <rect x="970" y="164" width="60" height="54" rx="10" fill="#12385a" stroke="#38bdf8" stroke-width="1.5"/><text x="1000" y="198" fill="#e0f2fe">14</text>
      <rect x="1046" y="164" width="60" height="54" rx="10" fill="#12385a" stroke="#38bdf8" stroke-width="1.5"/><text x="1076" y="198" fill="#e0f2fe">19</text>
      <rect x="1131" y="164" width="60" height="54" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="1161" y="198" fill="#dcfce7">29</text>
    </g>

    <!-- row B -->
    <text x="680" y="276" fill="#f1f5f9" font-size="19" font-weight="700">Team B</text>
    <text x="680" y="298" fill="#fca5a5" font-size="14" font-weight="600">prohibited</text>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <rect x="818" y="250" width="60" height="54" rx="10" fill="#12385a" stroke="#38bdf8" stroke-width="1.5"/><text x="848" y="284" fill="#e0f2fe">14</text>
      <rect x="894" y="250" width="60" height="54" rx="10" fill="#12385a" stroke="#38bdf8" stroke-width="1.5"/><text x="924" y="284" fill="#e0f2fe">19</text>
      <rect x="970" y="250" width="60" height="54" rx="10" fill="#12385a" stroke="#38bdf8" stroke-width="1.5"/><text x="1000" y="284" fill="#e0f2fe">14</text>
      <rect x="1046" y="250" width="60" height="54" rx="10" fill="#12385a" stroke="#38bdf8" stroke-width="1.5"/><text x="1076" y="284" fill="#e0f2fe">19</text>
      <rect x="1131" y="250" width="60" height="54" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="2"/><text x="1161" y="284" fill="#fef3c7">14</text>
    </g>

    <text x="680" y="346" fill="#94a3b8" font-size="15">Factual, knockout, controls and joint removal look the same.</text>
    <text x="680" y="370" fill="#94a3b8" font-size="15">Only the probe shows which policy is running.</text>
  </g>
</svg>
