<svg xmlns="http://www.w3.org/2000/svg" width="640" height="246" viewBox="0 0 640 246" role="img" aria-labelledby="title desc">
<title id="title">Claims and the evidence they require</title><desc id="desc">Observation requires visible communication. Causal influence needs a valid controlled replay showing a nonzero effect. Harmful exposure needs outsider outcome measures. Attribution additionally requires a declared policy and evidence distinguishing legitimate alternatives. These are requirements, not automatic conclusions; otherwise attribution remains unresolved.</desc>
<rect width="640" height="246" fill="#faf9f6"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#19313e">
<text x="28" y="31" font-size="24" fill="#4c606a" font-weight="700">Claim</text>
<text x="264" y="31" font-size="24" fill="#4c606a" font-weight="700">Evidence needed</text>
<rect x="16" y="48" width="608" height="42" rx="5" fill="#ffffff" stroke="#c9d2d3"/>
<text x="28" y="76" font-size="24" fill="#19313e" font-weight="700">Observation</text>
<text x="264" y="76" font-size="24" fill="#4c606a" font-weight="400">Visible communication</text>
<rect x="16" y="95" width="608" height="42" rx="5" fill="#ffffff" stroke="#c9d2d3"/>
<text x="28" y="123" font-size="24" fill="#19313e" font-weight="700">Causal influence</text>
<text x="264" y="123" font-size="24" fill="#4c606a" font-weight="400">Valid replay + nonzero effect</text>
<rect x="16" y="142" width="608" height="42" rx="5" fill="#ffffff" stroke="#c9d2d3"/>
<text x="28" y="170" font-size="24" fill="#19313e" font-weight="700">Harmful exposure</text>
<text x="264" y="170" font-size="24" fill="#4c606a" font-weight="400">Outsider outcome measures</text>
<rect x="16" y="189" width="608" height="42" rx="5" fill="#19313e" stroke="none"/>
<text x="28" y="217" font-size="24" fill="#ffffff" font-weight="700">Attribution</text>
<text x="264" y="217" font-size="24" fill="#e0eeec" font-weight="400">Policy + separating evidence</text>
</g></svg>
