<svg xmlns="http://www.w3.org/2000/svg" width="640" height="578" viewBox="0 0 640 578" role="img" aria-labelledby="title desc">
<title id="title">Match the claim to the evidence</title><desc id="desc">Observation raises a question. Valid controlled replay supports causal influence. Outcome measurement supports harmful exposure. Attribution also requires a declared policy and evidence that distinguishes legitimate alternatives. Without that extra evidence attribution remains unresolved.</desc>
<rect width="640" height="578" fill="#faf9f6"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#19313e">
<text x="28" y="48" font-size="32" fill="#19313e" font-weight="700" text-anchor="start">Match the claim to the evidence</text>
<rect x="28" y="81" width="584" height="86" rx="10" fill="#ffffff" stroke="#c9d2d3"/>
<text x="50" y="113" font-size="25" fill="#19313e" font-weight="700" text-anchor="start">Observation</text>
<text x="50" y="145" font-size="22" fill="#4c606a" font-weight="400" text-anchor="start">A message raises a question.</text>
<path d="M320 171v14m-6 -6 6 6 6 -6" fill="none" stroke="#4c606a" stroke-width="2"/>
<rect x="28" y="190" width="584" height="86" rx="10" fill="#ffffff" stroke="#c9d2d3"/>
<text x="50" y="222" font-size="25" fill="#19313e" font-weight="700" text-anchor="start">Causal influence</text>
<text x="50" y="254" font-size="22" fill="#4c606a" font-weight="400" text-anchor="start">Controlled replay measures an effect.</text>
<path d="M320 280v14m-6 -6 6 6 6 -6" fill="none" stroke="#4c606a" stroke-width="2"/>
<rect x="28" y="299" width="584" height="86" rx="10" fill="#ffffff" stroke="#c9d2d3"/>
<text x="50" y="331" font-size="25" fill="#19313e" font-weight="700" text-anchor="start">Harmful exposure</text>
<text x="50" y="363" font-size="22" fill="#4c606a" font-weight="400" text-anchor="start">Outcome measures show outsider harm.</text>
<path d="M320 389v14m-6 -6 6 6 6 -6" fill="none" stroke="#4c606a" stroke-width="2"/>
<rect x="28" y="408" width="584" height="86" rx="10" fill="#19313e" stroke="none"/>
<text x="50" y="440" font-size="25" fill="#ffffff" font-weight="700" text-anchor="start">Attribution</text>
<text x="50" y="472" font-size="22" fill="#e0eeec" font-weight="400" text-anchor="start">Policy + evidence separate alternatives.</text>
<text x="28" y="550" font-size="22" fill="#4c606a" font-weight="400" text-anchor="start">Without separating evidence, attribution stays unresolved.</text>
</g></svg>
