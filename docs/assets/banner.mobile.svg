<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-labelledby="t d">
  <title id="t">CCC: When Cooperation Looks Like Collusion</title>
  <desc id="d">Banner: When Cooperation Looks Like Collusion, the limits of counterfactual auditing in multi-agent AI, by Aarav Patel, Georgia Institute of Technology. A small chart shows the outsider reward for two constructed teams across evidence levels I0 to I3 (14, 19, 14, 19), identical for both, then at I4 a cost probe splits them: 29 for the permitted team and 14 for the prohibited team.</desc>
  <style>@font-face{font-family:'CCC Serif';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'CCC Serif';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2');}</style>
  <rect x="0.75" y="0.75" width="718.5" height="698.5" rx="16" fill="#f8f5f1" stroke="#e3dfda" stroke-width="1.5"/>
  <text x="48" y="70" fill="#194b37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">COUNTERFACTUAL COLLUSION CERTIFICATES</text>
  <text x="46" y="146" fill="#193025" font-family="'CCC Serif', 'Old Standard TT', Georgia, serif" font-size="56">When Cooperation Looks</text>
  <text x="46" y="208" fill="#193025" font-family="'CCC Serif', 'Old Standard TT', Georgia, serif" font-size="56">Like Collusion</text>
  <text x="48" y="256" fill="#65635b" font-family="'CCC Serif', 'Old Standard TT', Georgia, serif" font-style="italic" font-size="25">The limits of counterfactual auditing</text>
  <text x="48" y="290" fill="#65635b" font-family="'CCC Serif', 'Old Standard TT', Georgia, serif" font-style="italic" font-size="25">in multi-agent AI</text>
  <line x1="48" y1="322" x2="144" y2="322" stroke="#194b37" stroke-width="2"/>
  <text x="48" y="358" fill="#65635b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">Aarav Patel  ·  Georgia Institute of Technology</text>
  <line x1="48" y1="396" x2="672" y2="396" stroke="#d5dbd6" stroke-width="1.5"/>
  <text x="48" y="436" fill="#65635b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">OUTSIDER REWARD</text>
