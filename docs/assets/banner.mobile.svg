    <circle cx="526" cy="474.6" r="6" fill="#f8f5f1" stroke="#194b37" stroke-width="2.5"/>
    <text x="540" y="481" fill="#194b37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600">29 permitted</text>
    <path d="M422 540.6 L526 573.6" fill="none" stroke="#85543b" stroke-width="2.5" stroke-dasharray="7 5"/>
