<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="625" viewBox="0 0 1060 625"><title>PROSPECTIVE</title>
<rect width="100%" height="100%" fill="white"/>
<text x="24.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="17px" fill="#17324D" text-anchor="start" font-weight="bold">Evidence ladder: what each claim needs</text>
<text x="24.0" y="47.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#66727D" text-anchor="start" font-weight="normal">Concept diagram (no data). A knockout measures what a message did, not whether it should have done it.</text>
<rect x="912.0" y="12" width="132.0" height="24" rx="3" fill="white" stroke="#1d6b3a" stroke-width="1.6"/>
<text x="978.0" y="29.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#1d6b3a" text-anchor="middle" font-weight="bold">PROSPECTIVE RUN</text>
<rect x="28.0" y="360.0" width="232.0" height="122.0" rx="6" fill="#f1eee6" stroke="#5d5a52" stroke-width="2" />
<text x="42.0" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="22px" fill="#5d5a52" text-anchor="start" font-weight="bold">L0</text>
<text x="84.0" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#1b1a17" text-anchor="start" font-weight="bold">Suspicious text</text>
<text x="42.0" y="414.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">Does the transcript look like</text>
<text x="42.0" y="429.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">coordination?</text>
<rect x="280.0" y="300.0" width="232.0" height="122.0" rx="6" fill="#e4effa" stroke="#0b5cad" stroke-width="2" />
<text x="294.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="22px" fill="#0b5cad" text-anchor="start" font-weight="bold">L1</text>
<text x="336.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#1b1a17" text-anchor="start" font-weight="bold">Causal influence</text>
<text x="294.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">Does behaviour change when the</text>
<text x="294.0" y="369.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">message is removed?</text>
<line x1="262.0" y1="380.0" x2="278.0" y2="320.0" stroke="#66727D" stroke-width="1.6"/>
<polygon points="278.0,320.0 279.1,327.9 273.1,326.3" fill="#66727D"/>
<rect x="532.0" y="240.0" width="232.0" height="122.0" rx="6" fill="#fbe7e4" stroke="#b3261e" stroke-width="2" />
<text x="546.0" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="22px" fill="#b3261e" text-anchor="start" font-weight="bold">L2</text>
<text x="588.0" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#1b1a17" text-anchor="start" font-weight="bold">Harmful exposure</text>
<text x="546.0" y="294.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">Does the removal change outsider</text>
<text x="546.0" y="309.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">outcomes beyond controls?</text>
<line x1="514.0" y1="320.0" x2="530.0" y2="260.0" stroke="#66727D" stroke-width="1.6"/>
<polygon points="530.0,260.0 531.1,267.9 525.1,266.3" fill="#66727D"/>
<rect x="784.0" y="180.0" width="232.0" height="122.0" rx="6" fill="#efe7f8" stroke="#6b3fa0" stroke-width="2" />
<text x="798.0" y="210.0" font-family="Arial, Helvetica, sans-serif" font-size="22px" fill="#6b3fa0" text-anchor="start" font-weight="bold">L3</text>
<text x="840.0" y="210.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#1b1a17" text-anchor="start" font-weight="bold">Attribution</text>
<text x="798.0" y="234.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">Should this message have done</text>
<text x="798.0" y="249.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">it? (collusion vs legitimate</text>
<text x="798.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5d5a52" text-anchor="start" font-weight="normal">cooperation)</text>
<line x1="766.0" y1="260.0" x2="782.0" y2="200.0" stroke="#66727D" stroke-width="1.6"/>
<polygon points="782.0,200.0 783.1,207.9 777.1,206.3" fill="#66727D"/>
<text x="28.0" y="508.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#17324D" text-anchor="start" font-weight="bold">Information set needed (nested: each includes all earlier ones)</text>
<rect x="28.0" y="520.0" width="160.0" height="50.0" rx="5" fill="white" stroke="#5d5a52" stroke-width="2" />
<text x="38.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#5d5a52" text-anchor="start" font-weight="bold">I0</text>
<text x="68.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">transcript + factual</text>
<rect x="196.0" y="520.0" width="160.0" height="50.0" rx="5" fill="white" stroke="#0b5cad" stroke-width="2" />
<text x="206.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#0b5cad" text-anchor="start" font-weight="bold">I1</text>
<text x="236.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">+ single knockout K</text>
<rect x="364.0" y="520.0" width="160.0" height="50.0" rx="5" fill="white" stroke="#b3261e" stroke-width="2" />
<text x="374.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#b3261e" text-anchor="start" font-weight="bold">I2</text>
<text x="404.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">+ sham / placebo</text>
<rect x="532.0" y="520.0" width="160.0" height="50.0" rx="5" fill="white" stroke="#b3261e" stroke-width="2" />
<text x="542.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#b3261e" text-anchor="start" font-weight="bold">I3</text>
<text x="572.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">+ joint knockout,</text>
<text x="572.0" y="551.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">same-sender</text>
<rect x="700.0" y="520.0" width="160.0" height="50.0" rx="5" fill="white" stroke="#6b3fa0" stroke-width="2" />
<text x="710.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#6b3fa0" text-anchor="start" font-weight="bold">I4</text>
<text x="740.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">+ incentive / environment</text>
<text x="740.0" y="551.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">probe</text>
<rect x="868.0" y="520.0" width="160.0" height="50.0" rx="5" fill="white" stroke="#6b3fa0" stroke-width="2" />
<text x="878.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="15px" fill="#6b3fa0" text-anchor="start" font-weight="bold">I5</text>
<text x="908.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">+ external normative</text>
<text x="908.0" y="551.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#1b1a17" text-anchor="start" font-weight="normal">record</text>
<line x1="144.0" y1="482.0" x2="108.0" y2="520.0" stroke="#5d5a52" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="396.0" y1="422.0" x2="276.0" y2="520.0" stroke="#0b5cad" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="648.0" y1="362.0" x2="444.0" y2="520.0" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="648.0" y1="362.0" x2="612.0" y2="520.0" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="900.0" y1="302.0" x2="780.0" y2="520.0" stroke="#6b3fa0" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="900.0" y1="302.0" x2="948.0" y2="520.0" stroke="#6b3fa0" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="28.0" y="60.0" width="1004.0" height="44.0" rx="5" fill="#fbf0d4" stroke="#8a5a00" stroke-width="1.6" />
<text x="42.0" y="78.0" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#8a5a00" text-anchor="start" font-weight="bold">Uncertainty</text>
<text x="130.0" y="78.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#1b1a17" text-anchor="start" font-weight="normal">If the information set cannot separate a twin pair, the supported answer is to abstain at that rung (identifiability), not to guess.</text>
<text x="130.0" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#5d5a52" text-anchor="start" font-weight="normal">Equivalence under a fixed set is definitional; the measured claims are the frontier, the pipeline symmetry check, prevalence and baseline behaviour.</text>
<text x="24.0" y="617.0" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#b3261e" text-anchor="start" font-weight="bold">eps=0 established; eps=0.1: platform-dependent, not established (D-048; post hoc).</text>
</svg>
